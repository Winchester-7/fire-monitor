<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fire Monitor">
<meta name="theme-color" content="#1c1e26">
<title>Fire Monitor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>
<style>
/* =====================================================================
   Golden Dragon Fire Monitor v2 — "Glass" design
   Dark frosted glass over a blurred hotel interior, white metric cards,
   orange accent, dock with magnification, toast pills, fade/rise motion.
   ===================================================================== */
:root{
  --glass:rgba(28,30,38,.72); --glass-2:rgba(18,20,26,.6); --glass-row:rgba(255,255,255,.08);
  --gline:rgba(255,255,255,.14); --gline2:rgba(255,255,255,.22);
  --orange:#ff701e; --orange-h:#fa630f; --green:#22c55e; --pink:#ff3b71; --blue:#3b82f6; --violet:#a855f7; --amber:#f59e0b;
  --fire:#ff3b30;
  --ink:#1e293b; --ink-m:#64748b; --ink-l:#94a3b8;
  --wt:#fff; --wt-m:rgba(255,255,255,.72); --wt-d:rgba(255,255,255,.5);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --ease:cubic-bezier(.4,0,.2,1); --spring:cubic-bezier(.25,1,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1c1e26;color:var(--wt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.hidden{display:none!important}

/* ---------- background photo + tints ---------- */
.bg{position:fixed;inset:-20px;z-index:0;background:#2a2622 url(bg.jpg) center/cover no-repeat;transition:filter .8s var(--ease)}
.tint{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.25));transition:background .8s var(--ease)}
body.night .bg{filter:brightness(.45) saturate(.8)}
body.alarm .tint{background:radial-gradient(130% 70% at 50% 0%,rgba(255,59,48,.65),rgba(120,10,6,.55) 60%,rgba(40,0,0,.6));animation:bgpulse 1.6s ease-in-out infinite}
body.attn .tint{background:radial-gradient(130% 70% at 50% 0%,rgba(255,140,30,.45),rgba(60,30,0,.45))}
@keyframes bgpulse{50%{opacity:.6}}

/* ---------- main glass card ---------- */
#app{position:fixed;inset:0;z-index:1;display:flex;justify-content:center}
main{position:absolute;top:calc(var(--safe-t) + 6px);left:8px;right:8px;bottom:8px;
  background:var(--glass);backdrop-filter:blur(36px) saturate(190%);-webkit-backdrop-filter:blur(36px) saturate(190%);
  border:1.5px solid var(--gline);border-radius:32px;box-shadow:0 24px 60px rgba(0,0,0,.35);
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:20px 16px calc(var(--safe-b) + 104px);transition:background .5s var(--ease),border-color .5s,box-shadow .5s}
main::-webkit-scrollbar{display:none}
body.night main{background:rgba(14,15,20,.84)}
body.alarm main{border-color:rgba(255,120,100,.55);box-shadow:0 0 0 1px rgba(255,59,48,.25),0 24px 70px rgba(255,59,48,.35)}
@media (min-width:700px){main{left:50%;right:auto;width:540px;transform:translateX(-50%);top:24px;bottom:24px}}

/* ---------- motion ---------- */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastFade{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes grow{from{transform:scaleY(.05)}}
@keyframes draw{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}
@keyframes fadeArea{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.07);opacity:.65}}
@keyframes ecg{to{stroke-dashoffset:-240}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.35}}
.view{animation:fadeIn .25s ease}
.anim .rv{animation:rise .55s var(--spring) both}
.anim .rv:nth-child(1){animation-delay:.02s}.anim .rv:nth-child(2){animation-delay:.07s}.anim .rv:nth-child(3){animation-delay:.12s}
.anim .rv:nth-child(4){animation-delay:.17s}.anim .rv:nth-child(5){animation-delay:.22s}.anim .rv:nth-child(6){animation-delay:.27s}
.anim .rv:nth-child(7){animation-delay:.32s}.anim .rv:nth-child(8){animation-delay:.37s}.anim .rv:nth-child(n+9){animation-delay:.42s}
.anim .bars i{animation:grow .7s var(--spring) both;transform-origin:bottom}
.anim .bars i:nth-child(2){animation-delay:.05s}.anim .bars i:nth-child(3){animation-delay:.1s}.anim .bars i:nth-child(4){animation-delay:.15s}
.anim .bars i:nth-child(5){animation-delay:.2s}.anim .bars i:nth-child(6){animation-delay:.25s}.anim .bars i:nth-child(7){animation-delay:.3s}
.anim .bars i:nth-child(n+8){animation-delay:.35s}
.anim .drawl{stroke-dasharray:var(--len,600);animation:draw 1.2s var(--ease) both .15s}
.anim .area{animation:fadeArea 1s ease both .5s}
.anim .peak{animation:pop .45s var(--spring) both 1.1s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 16px}
.hdr h2{font-size:21px;font-weight:500;letter-spacing:-.2px;line-height:1.2;color:rgba(255,255,255,.95)}
.hdr h2 strong{font-weight:700;color:#fff}
.hdr p{font-size:12.5px;color:var(--wt-m);margin-top:3px;display:flex;align-items:center;gap:6px}
.hbtns{display:flex;gap:8px;flex:none}
.gbtn{width:40px;height:40px;border-radius:50%;background:var(--glass-2);border:1px solid var(--gline);display:grid;place-items:center;color:rgba(255,255,255,.88);position:relative;transition:all .18s ease;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.gbtn:active{transform:scale(.92);background:rgba(255,255,255,.18)}
.gbtn svg{width:18px;height:18px}
.gbtn .nd{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px rgba(28,30,38,.9)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wt-d);flex:none;display:inline-block}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.22)}
.dot.bad{background:var(--fire);box-shadow:0 0 0 3px rgba(255,59,48,.25);animation:blink 1s infinite}

/* ---------- white cards ---------- */
.wcard{background:#fff;color:var(--ink);border-radius:20px;border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 15px rgba(0,0,0,.08);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.tap:active{transform:translateY(-2px) scale(.985);box-shadow:0 8px 22px rgba(0,0,0,.16)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.met{padding:12px 13px;height:112px;display:flex;flex-direction:column;justify-content:space-between;border-radius:18px;text-align:left;width:100%}
.met .mt{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink)}
.badge{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.badge svg{width:14px;height:14px}
.badge.orange{background:#fff3ec;color:var(--orange)}.badge.pink{background:#fdf2f4;color:var(--pink)}
.badge.green{background:#f0fdf4;color:var(--green)}.badge.blue{background:#eff6ff;color:var(--blue)}
.mg{height:36px;display:flex;align-items:center;justify-content:center}
.mb{display:flex;align-items:baseline;gap:4px;white-space:nowrap;overflow:hidden}
.mv{font-size:19px;font-weight:700;letter-spacing:-.3px}
.mv.orange{color:var(--orange)}.mv.pink{color:var(--pink)}.mv.green{color:var(--green)}.mv.blue{color:var(--blue)}.mv.grey{color:var(--ink-l)}
.mu{font-size:11px;font-weight:500;color:var(--ink-m);overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:5px;height:32px}
.bars i{display:block;width:4px;border-radius:3px;background:currentColor;opacity:.9}
.bars i:nth-child(even){opacity:.55}

/* chart card */
.chart{padding:13px 14px 10px;margin-bottom:12px}
.ch-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ch-h b{font-size:14px;font-weight:700}
.ch-h small{display:block;font-size:11px;color:var(--ink-l);font-weight:500;margin-top:1px}
.seg{display:flex;background:#f8fafc;border:1px solid #e2e8f0;border-radius:99px;padding:2px}
.seg button{font-size:11px;font-weight:600;color:var(--ink-m);padding:3px 10px;border-radius:99px;transition:all .2s var(--ease)}
.seg button.on{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(255,112,30,.4)}
.chart svg{display:block;width:100%;height:150px;overflow:visible}
.chart text{font-size:9.5px;fill:#94a3b8;font-family:inherit}

/* hero (status) card */
.hero{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;min-height:170px;position:relative;overflow:hidden}
.hero .ht{display:flex;flex-direction:column;justify-content:space-between;align-self:stretch;gap:12px;z-index:2;min-width:0}
.hero h3{font-size:17px;font-weight:700;line-height:1.25;color:var(--ink)}
.hero h3 small{display:block;font-size:12px;font-weight:500;color:var(--ink-m);margin-top:3px}
.hs{display:flex;gap:18px}
.hs b{display:block;font-size:17px;font-weight:700;color:var(--ink)}
.hs b span{font-size:12px;font-weight:500;color:var(--ink-m)}
.hs small{font-size:10.5px;color:var(--ink-l)}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ffd2b3,var(--orange),#ffb27a,#ffe6d6,var(--orange),#ffd2b3);animation:spin 12s linear infinite;-webkit-mask:radial-gradient(circle,transparent 60%,#000 61%,#000 67%,transparent 68%);mask:radial-gradient(circle,transparent 60%,#000 61%,#000 67%,transparent 68%)}
.ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(34,197,94,.28),rgba(34,197,94,.05) 60%,transparent 72%);animation:breathe 4s ease-in-out infinite}
.ring .core{position:absolute;inset:24px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#fff,#f4f6fa 70%);box-shadow:0 10px 26px rgba(15,23,42,.14),inset 0 0 0 1px #eef1f6;z-index:1}
.ring .core svg{width:46px;height:46px}

/* section header */
.sect{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.sect .st{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:#fff}
.sect .st::before{content:"";width:3.5px;height:16px;border-radius:99px;background:var(--orange)}
.sect a,.sect button{font-size:12px;font-weight:600;color:var(--wt-m);text-decoration:none;transition:color .15s}
.sect a:active{color:#fff}

/* floor cards (horizontal) */
.floors{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.floors::-webkit-scrollbar{display:none}
.fl{flex:none;width:200px;height:100px;border-radius:18px;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;scroll-snap-align:start;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.fl:active{transform:translateY(-2px) scale(.98)}
.fl.w{background:#fff;color:var(--ink);box-shadow:0 4px 15px rgba(0,0,0,.08)}
.fl.o{background:var(--orange);color:#fff;box-shadow:0 8px 24px rgba(255,112,30,.35)}
.fl.r{background:linear-gradient(135deg,#ff5a3c,#e0241a);color:#fff;box-shadow:0 8px 26px rgba(255,59,48,.5)}
.fl .fi{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl .fi b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .fi small{font-size:10px;line-height:1.3;opacity:.75}
.pillday{display:inline-block;align-self:flex-start;font-size:10px;font-weight:600;padding:2px 9px;border-radius:99px;margin-top:4px}
.fl.w .pillday{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.fl.o .pillday,.fl.r .pillday{background:#fff;color:var(--orange)}
.fl.r .pillday{color:#e0241a}
.thumb{width:58px;height:58px;border-radius:50%;flex:none;background:#eef1f6 center/cover no-repeat;box-shadow:0 6px 16px rgba(0,0,0,.18),0 0 0 3px rgba(255,255,255,.85)}

/* dark glass rows (events) */
.list{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:11px;padding:10px 11px;width:100%;text-align:left;background:var(--glass-row);border:1px solid rgba(255,255,255,.1);border-radius:18px;transition:background .18s ease,transform .18s ease}
.ev:active{background:rgba(255,255,255,.16);transform:scale(.99)}
.ev .ic{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.12)}
.ev .tx{flex:1;min-width:0}
.tag{display:inline-block;font-size:9.5px;font-weight:700;padding:1.5px 7px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;margin-bottom:3px}
.ev .t1{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t2{font-size:11.5px;color:var(--wt-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.ev .tm{font-size:10.5px;color:var(--wt-d)}
.more3{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.lv-fire .ic{background:rgba(255,59,48,.28)} .lv-fire .tag{background:var(--fire)}
.lv-attention .ic,.lv-alarm .ic{background:rgba(255,112,30,.28)} .lv-attention .tag,.lv-alarm .tag{background:var(--orange)}
.lv-malfunction .ic{background:rgba(59,130,246,.28)} .lv-malfunction .tag{background:var(--blue)}
.lv-cleared .ic{background:rgba(34,197,94,.26)} .lv-cleared .tag{background:var(--green)}
.lv-info .tag{background:rgba(255,255,255,.22)}
.empty{color:var(--wt-d);text-align:center;padding:24px 8px;font-size:13.5px;background:var(--glass-row);border-radius:18px;border:1px dashed rgba(255,255,255,.14)}

/* profile panel (settings) */
.prof{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.prof .av{width:50px;height:50px;border-radius:50%;padding:2px;background:conic-gradient(var(--orange),#ffd2b3,var(--orange));flex:none}
.prof .av img{width:100%;height:100%;border-radius:50%;display:block;border:2px solid #1c1e26}
.prof b{font-size:16px;display:block}.prof small{font-size:12px;color:var(--wt-m)}
.gpanel{background:var(--glass-row);border:1px solid rgba(255,255,255,.12);border-radius:20px}
.triple{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 4px;margin-bottom:12px}
.triple div{text-align:center;border-left:1px solid rgba(255,255,255,.12)}
.triple div:first-child{border-left:0}
.triple b{display:block;font-size:17px;font-weight:700}.triple small{font-size:11px;color:var(--wt-m)}
.rows .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid rgba(255,255,255,.08)}
.rows .row:first-child{border-top:0}
.rows .l{flex:1;min-width:0;font-size:14px;font-weight:600}
.rows .l small{display:block;font-size:12px;font-weight:400;color:var(--wt-m);margin-top:1px}
.rows input{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;color:#fff;font:inherit;font-size:14px;text-align:right;outline:none;width:150px;min-width:0}
.rows input:focus{border-color:var(--orange)}
.themesw{display:flex;gap:4px;background:rgba(15,17,24,.65);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:4px}
.themesw button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.6);transition:all .2s ease}
.themesw button.on{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(255,112,30,.5)}
.themesw svg{width:14px;height:14px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:99px;font-size:14.5px;font-weight:700;text-decoration:none;transition:all .2s ease;width:100%}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.or{background:var(--orange);color:#fff;box-shadow:0 4px 14px rgba(255,112,30,.4)}
.btn.or:active{background:var(--orange-h)}
.btn.gh{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn.wh{background:#fff;color:#c0180f;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.btn.sm{width:auto;padding:8px 14px;font-size:12.5px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btns .wide{grid-column:1/-1}

/* calendar (events) */
.cal{padding:12px 12px 8px;margin-bottom:4px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 4px}
.cal-h b{font-size:14.5px;font-weight:700;text-transform:capitalize}
.cal-h .nv{display:flex;gap:6px}
.cal-h .nv button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;transition:background .15s}
.cal-h .nv button:active{background:var(--orange)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal-g .wd{font-size:10.5px;color:var(--wt-d);padding:2px 0 4px}
.cal-g button{height:30px;margin:0 auto;width:34px;border-radius:99px;font-size:12px;font-weight:500;color:rgba(255,255,255,.88);position:relative;transition:all .18s ease}
.cal-g button.has::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--orange)}
.cal-g button.mal::after{background:var(--blue)}
.cal-g button.today{background:var(--green);color:#fff;font-weight:700}
.cal-g button.firey{background:var(--pink);color:#fff;font-weight:700}
.cal-g button.sel{background:var(--orange);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(255,112,30,.5)}
.cal-g button.has.today::after,.cal-g button.has.sel::after,.cal-g button.firey::after{background:#fff}
.cal-g button:disabled{visibility:hidden}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--glass-2);border:1px solid var(--gline);font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8);white-space:nowrap;position:relative;transition:all .2s ease}
.chip.on{background:var(--orange);color:#fff;border-color:transparent;box-shadow:0 2px 10px rgba(255,112,30,.45)}
.chip .bd{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--fire);box-shadow:0 0 0 2px #1c1e26;animation:blink 1s infinite}

/* plans */
.planwrap{position:relative;height:calc(100vh - 330px);height:calc(100dvh - 330px);min-height:320px;border-radius:22px;overflow:hidden;background:#141414;touch-action:none;box-shadow:0 4px 15px rgba(0,0,0,.12);border:3px solid #fff}
.planwrap .stage{position:absolute;left:0;top:0;transform-origin:0 0}
.planwrap img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.d{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--orange);border:2px solid #fff;box-shadow:0 0 8px rgba(255,112,30,.6),0 1px 3px rgba(0,0,0,.5)}
.d.off{background:#9a958c}
.d.mal{background:var(--blue)}
.d.att{background:var(--amber);width:18px;height:18px;margin:-9px 0 0 -9px}
.d.fire{background:var(--fire);width:20px;height:20px;margin:-10px 0 0 -10px;animation:pinp 1s infinite;z-index:3}
.d.sel{outline:3px solid var(--orange);outline-offset:2px}
@keyframes pinp{50%{box-shadow:0 0 0 14px rgba(255,59,48,0)}0%{box-shadow:0 0 0 0 rgba(255,59,48,.6)}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:12px 2px 0;color:var(--wt-m);font-size:11.5px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.zoombtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoombtns button{width:38px;height:38px;border-radius:50%;background:rgba(28,30,38,.82);color:#fff;font-size:19px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);transition:transform .15s var(--spring)}
.zoombtns button:active{transform:scale(.88);background:var(--orange)}
.pcap{position:absolute;left:10px;bottom:10px;z-index:5;background:rgba(28,30,38,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.18)}

/* ALARM */
.alarm-card{border-radius:26px;padding:18px 16px 16px;text-align:center;background:linear-gradient(160deg,rgba(255,90,60,.35),rgba(160,15,10,.35));border:1.5px solid rgba(255,150,130,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.siren{position:relative;width:116px;height:116px;margin:0 auto 10px}
.siren span{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,170,150,.8);animation:wave 1.8s ease-out infinite}
.siren span:nth-child(2){animation-delay:.6s}.siren span:nth-child(3){animation-delay:1.2s}
.siren i{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ff9a6c,var(--orange) 45%,#d4180e);display:grid;place-items:center;font-style:normal;font-size:40px;box-shadow:0 0 50px rgba(255,90,40,.85)}
@keyframes wave{from{transform:scale(.55);opacity:1}to{transform:scale(1.4);opacity:0}}
.alarm-card .kind{display:inline-block;font-size:12px;letter-spacing:.3em;font-weight:800;color:#fff;background:var(--fire);padding:4px 12px 4px 15px;border-radius:99px;box-shadow:0 4px 14px rgba(255,59,48,.5)}
.alarm-card .floor{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:10px 0 2px}
.alarm-card .place{font-size:23px;font-weight:650}
.alarm-card .dev{margin-top:8px;color:#ffe1da;font-size:13.5px}
.alarm-card .when{margin-top:3px;color:rgba(255,225,215,.75);font-size:12.5px}
.mini{position:relative;margin:12px 0 0;border-radius:20px;overflow:hidden;background:#fff;height:180px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px solid #fff}
.mini img{position:absolute;max-width:none;transform-origin:0 0}
.mini .pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--fire);border:2px solid #fff;animation:pinp 1s infinite}

/* bottom sheet = glass modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--safe-b) + 8px);z-index:41;background:rgba(28,30,38,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1.5px solid rgba(255,255,255,.18);border-radius:28px;padding:10px 18px 20px;transform:translateY(calc(100% + 40px));transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:84vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.sheet.on{transform:none}
@media (min-width:700px){.sheet{left:50%;right:auto;width:500px;margin-left:-250px}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 12px}
.sheet h3{font-size:19px;font-weight:700}
.sheet .sub{color:var(--wt-m);font-size:13px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:9px 12px;font-size:14px;margin:14px 0;background:var(--glass-row);border-radius:16px;padding:12px 14px}
.kv span{color:var(--wt-m)}

/* dock (bottom nav) */
.dock{position:fixed;left:50%;bottom:calc(var(--safe-b) + 18px);transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;padding:7px;background:rgba(15,17,24,.78);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1.5px solid rgba(255,255,255,.18);border-radius:99px;box-shadow:0 14px 40px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none}
.dock button{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.75);position:relative;transform-origin:center bottom;transition:transform .16s var(--spring),background .18s ease,box-shadow .18s ease,color .18s;will-change:transform}
.dock button svg{width:21px;height:21px}
.dock button.on{background:var(--orange);color:#fff;box-shadow:0 6px 16px rgba(255,112,30,.5)}
.dock .tip{position:absolute;bottom:62px;left:50%;background:rgba(18,20,26,.94);color:#fff;font-size:11px;font-weight:600;padding:4px 11px;border-radius:99px;white-space:nowrap;pointer-events:none;border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;transform:translate(-50%,4px) scale(.92);transition:all .16s ease}
.dock button.hv .tip{opacity:1;transform:translate(-50%,0) scale(1)}
.dock .bd{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--fire);color:#fff;font-size:10px;font-weight:700;line-height:17px;padding:0 4px;box-shadow:0 0 0 2px rgba(15,17,24,.9)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translate(-50%,0);z-index:60;background:rgba(18,20,26,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);max-width:calc(100vw - 32px);text-align:center;display:none}
.toast.on{display:block;animation:toastFade .25s ease}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:10px 4px}
.ob .logo{width:92px;height:92px;border-radius:26px;margin:0 auto 18px;box-shadow:0 14px 40px rgba(255,112,30,.35),0 0 0 1.5px rgba(255,255,255,.3)}
.ob h2{font-size:26px;margin:0 0 8px;letter-spacing:-.02em}
.ob p{color:var(--wt-m);margin:0 auto 18px;max-width:340px;font-size:14px}
.steps{text-align:left;display:flex;flex-direction:column;gap:8px;margin:4px 0 18px}
.step{display:flex;gap:12px;align-items:center;padding:12px 14px;font-size:14px}
.step b.n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:13px;box-shadow:0 3px 10px rgba(255,112,30,.45)}
.hl{color:var(--orange);font-weight:700}
.codein{width:100%;font:700 24px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;text-align:center;text-transform:uppercase;padding:16px 10px;border-radius:20px;background:#fff;border:2px solid #fff;color:var(--ink);outline:none;box-shadow:0 4px 15px rgba(0,0,0,.1);transition:border-color .2s,box-shadow .2s}
.codein:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,112,30,.25)}
.err{color:#ffb4a8;font-size:13.5px;min-height:20px;margin:10px 0}
.demo-badge{position:fixed;top:calc(var(--safe-t) + 1px);left:50%;transform:translateX(-50%);z-index:30;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:var(--orange);color:#fff}
</style>
</head>
<body>
<div class="bg"></div><div class="tint"></div>
<div id="app">
  <main id="main"></main>
</div>
<nav id="nav" class="dock hidden">
  <button data-v="home"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></svg><span class="tip">Обзор</span></button>

  <button data-v="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg><span class="tip">Этажи 3D</span></button>
  <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span class="tip">Настройки</span></button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetc"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const CFG = Object.assign({relay:'https://ntfy.sh', vapid:'', site:'Golden Dragon Hotel', phone:''}, window.FM_CONFIG||{});
const DEMO = !!window.FM_DEMO || location.hash.indexOf('demo')>=0;
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV = {
  fire:{ic:'🔥',name:'Пожар',cls:'lv-fire'}, attention:{ic:'⚠️',name:'Внимание',cls:'lv-attention'},
  alarm:{ic:'🚨',name:'Тревога',cls:'lv-alarm'}, malfunction:{ic:'🔧',name:'Неисправность',cls:'lv-malfunction'},
  info:{ic:'ℹ️',name:'Информация',cls:'lv-info'}
};
const rank = l=>({fire:5,attention:4,alarm:3,malfunction:2,info:1}[l]||0);
const S = {code:null, site:null, events:[], status:null, view:'home', plan:null, filter:'all', lastPoll:0, phone:'', seen:0, range:'week', day:null, calM:null, theme:'day'};
const ls = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- IndexedDB (shared with service worker) ---------- */
function idb(){return new Promise((res,rej)=>{if(!('indexedDB' in window))return rej('no idb');const r=indexedDB.open('firemon',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('events',{keyPath:'id'});d.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbAll(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('events').objectStore('events').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}catch(e){return []}}
async function dbPut(evs){try{const d=await idb();const t=d.transaction('events','readwrite');evs.forEach(e=>t.objectStore('events').put(e));}catch(e){}}
async function kvSet(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
async function kvGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}

/* ---------- crypto: site data is encrypted with the pair code ---------- */
const normCode = c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmtCode = c=>{c=normCode(c);return [c.slice(0,4),c.slice(4,8),c.slice(8,12)].filter(Boolean).join('-')};
const topic = sfx=>'gdfm-'+normCode(S.code).toLowerCase()+(sfx?'-'+sfx:'');
const b64d = s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptSite(code){
  const enc = window.FM_SITE_ENC || await (await fetch('site.enc',{cache:'no-cache'})).json();
  const key = await crypto.subtle.importKey('raw',new TextEncoder().encode(normCode(code)),'PBKDF2',false,['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(enc.salt),iterations:enc.iter,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(enc.iv)},k,b64d(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function indexSite(s){
  s.Z={}; s.zones.forEach(z=>s.Z[z.no]=z);
  s.D={}; s.devices.forEach(d=>s.D[d.g]=d);
  s.P={}; s.plans.forEach(p=>s.P[p.id]=p);
  s.PN={}; s.plans.forEach(p=>s.PN[p.name]=p);
  s.PC={}; s.devices.forEach(d=>{const seen={};d.p.forEach(q=>{if(!seen[q[0]]){seen[q[0]]=1;s.PC[q[0]]=(s.PC[q[0]]||0)+1}})});
  return s;
}

/* ---------- time ---------- */
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);if(s<45)return 'только что';if(s<3600)return Math.round(s/60)+' мин назад';if(s<86400)return Math.round(s/3600)+' ч назад';return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
const hm = ts=>new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function dayLabel(ts){const d=new Date(ts),t=new Date();const y=new Date(Date.now()-864e5);if(d.toDateString()===t.toDateString())return 'Сегодня';if(d.toDateString()===y.toDateString())return 'Вчера';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
const dayKey = ts=>{const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function greet(){const h=new Date().getHours();return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':h<23?'Добрый вечер':'Доброй ночи'}

/* ---------- relay (ntfy) ---------- */
async function relayPoll(){
  if(DEMO||!S.code) return;
  try{
    const r = await fetch(`${CFG.relay}/${topic('e')}/json?poll=1&since=12h`,{cache:'no-store'});
    const txt = await r.text(); const evs=[]; let st=null;
    txt.split('\n').forEach(l=>{if(!l.trim())return;try{const m=JSON.parse(l);if(m.event!=='message')return;const o=JSON.parse(m.message);if(o.t==='event')evs.push(o);else if(o.t==='status'&&(!st||o.ts>st.ts))st=o}catch(e){}});
    if(evs.length){await dbPut(evs)}
    if(st){S.status=st;kvSet('status',st)}
    S.lastPoll=Date.now();
    await loadEvents(); render();
  }catch(e){console.warn('relay',e)}
}
async function relaySend(obj){
  const r = await fetch(`${CFG.relay}/${topic('s')}`,{method:'POST',body:JSON.stringify(obj)});
  if(!r.ok) throw new Error('relay '+r.status);
}
async function loadEvents(){
  const all = await dbAll();
  all.sort((a,b)=>b.ts-a.ts);
  S.events = all.slice(0,500);
}

/* ---------- derived state ---------- */
function online(){
  const st=S.status; if(DEMO) return {ok:true,txt:'Ресепшен на связи · только что',short:'только что'};
  if(!st) return {ok:false,txt:'Ожидание связи с ресепшеном',short:'ожидание'};
  const lim=((st.hbMin||15)*1.6+3)*60e3, age=Date.now()-st.ts;
  if(age>lim) return {ok:false,txt:'Нет связи с ресепшеном · '+ago(st.ts),short:ago(st.ts)};
  if(!st.firesec) return {ok:false,txt:'FireSec не запущен на ресепшене',short:'FireSec выкл.'};
  return {ok:true,txt:'Ресепшен на связи · '+ago(st.ts),short:ago(st.ts)};
}
function activeAlarms(){
  // Prefer the agent's status snapshot; add newer events not yet in it.
  const act=new Map();
  if(S.status&&S.status.active) S.status.active.forEach(e=>{if(rank(e.level)>=3)act.set(keyOf(e),e)});
  const since=S.status?S.status.ts:0;
  S.events.slice().reverse().forEach(e=>{ if(e.ts<since||e.test) return; const k=keyOf(e);
    if(e.cleared) act.delete(k); else if(rank(e.level)>=3) act.set(k,e)});
  return [...act.values()].sort((a,b)=>rank(b.level)-rank(a.level)||b.ts-a.ts);
}
const keyOf = e=>(e.guid||('z'+e.zoneNo))+'|'+(e.stateCode||e.state);
function devPos(e){
  const s=S.site; if(!s||!e) return null;
  const d=e.guid&&s.D[e.guid]; if(d&&d.p&&d.p.length){const p=d.p[0];return {plan:s.P[p[0]],x:p[1],y:p[2]}}
  const z=e.zoneNo&&s.Z[e.zoneNo]; if(z&&z.pos&&z.pos.length){const p=z.pos[0];return {plan:s.P[p.plan],x:p.x,y:p.y}}
  return null;
}

/* ---------- small svg helpers ---------- */
const IC = {
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/></svg>',
  sensor:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 2.6 3.8 4.2 3.8 7.8A3.8 3.8 0 0112 13.6a3.8 3.8 0 01-3.8-3.8c0-1.4.6-2.4 1.3-3.2.1 1.1.8 1.9 1.7 1.9 1.1 0 1.6-.9 1.3-2.2C12.2 5.1 11.8 3.6 12 2z"/><rect x="5" y="15.5" width="14" height="5" rx="2.5"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3.5v5.5c0 4.6-3.3 8-8 9-4.7-1-8-4.4-8-9V6.5z"/><path d="M9 12l2 2 4-4"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>',
  dots:'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2"><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></g></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>',
  left:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>'
};
function barsSVG(vals,color){const mx=Math.max(1,...vals);return `<div class="bars" style="color:${color}">${vals.map(v=>`<i style="height:${Math.max(12,Math.round(v/mx*100))}%"></i>`).join('')}</div>`}
function ecgSVG(ok){const c=ok?'#ff3b71':'#cbd5e1';return `<svg width="110" height="34" viewBox="0 0 110 34"><path d="M0 20h22l5-9 6 19 6-26 6 22 4-6h20l4-6 5 10 4-4h28" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${ok?'stroke-dasharray="120 120" style="animation:ecg 2.4s linear infinite"':''}/></svg>`}
function gaugeSVG(frac){const r=24,L=Math.PI*r,v=Math.max(0,Math.min(1,frac));return `<svg width="70" height="38" viewBox="0 0 70 38"><path d="M11 33a24 24 0 0148 0" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/><path class="drawl" style="--len:${L.toFixed(1)}" d="M11 33a24 24 0 0148 0" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(L*v).toFixed(1)} ${L.toFixed(1)}"/></svg>`}

/* activity chart: real event counts, smoothed */
function chartData(){
  const ev=S.events.filter(e=>!e.test), now=new Date();
  if(S.range==='day'){
    const bins=new Array(8).fill(0), start=Date.now()-24*3600e3;
    ev.forEach(e=>{if(e.ts>=start){const i=Math.min(7,Math.floor((e.ts-start)/(3*3600e3)));bins[i]++}});
    const lab=bins.map((_,i)=>{const d=new Date(start+(i+1)*3*3600e3);return String(d.getHours()).padStart(2,'0')+':00'});
    return {vals:bins,lab};
  }
  const days=[],lab=[];
  for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);days.push(dayKey(d));lab.push(d.toLocaleDateString('ru-RU',{weekday:'short'}).replace('.',''))}
  const vals=days.map(k=>ev.filter(e=>dayKey(e.ts)===k).length);
  return {vals,lab};
}
function chartSVG(){
  const {vals,lab}=chartData(), W=320,H=150,pl=26,pr=8,pt=26,pb=20, n=vals.length;
  const mx=Math.max(4,...vals), xs=i=>pl+(W-pl-pr)*i/(n-1), ys=v=>pt+(H-pt-pb)*(1-v/mx);
  const P=vals.map((v,i)=>[xs(i),ys(v)]);
  let d=`M${P[0][0]},${P[0][1]}`;
  for(let i=1;i<n;i++){const [x0,y0]=P[i-1],[x1,y1]=P[i],cx=(x0+x1)/2;d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`}
  const area=d+` L${P[n-1][0]},${H-pb} L${P[0][0]},${H-pb} Z`;
  let grid='';for(let k=0;k<=4;k++){const y=pt+(H-pt-pb)*k/4;grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e2e8f0" stroke-dasharray="3 4"/><text x="0" y="${y+3}">${Math.round(mx*(1-k/4))}</text>`}
  const mi=vals.indexOf(Math.max(...vals)), [px,py]=P[mi], tot=vals.reduce((a,b)=>a+b,0);
  const word=v=>v%10===1&&v%100!==11?'событие':(v%10>=2&&v%10<=4&&(v%100<10||v%100>=20))?'события':'событий';
  const peak=vals[mi]>0?`<g class="peak" style="transform-origin:${px}px ${py}px"><line x1="${px}" x2="${px}" y1="${py}" y2="${H-pb}" stroke="#ff701e" stroke-dasharray="2 3" opacity=".6"/><circle cx="${px}" cy="${py}" r="5" fill="#fff" stroke="#ff701e" stroke-width="2.5"/><rect x="${Math.min(W-78,Math.max(pl,px-38))}" y="${py-24}" width="76" height="17" rx="8.5" fill="#fff3ec" stroke="#ff701e"/><text x="${Math.min(W-78,Math.max(pl,px-38))+38}" y="${py-12.5}" text-anchor="middle" style="fill:#ff701e;font-weight:700">${vals[mi]} ${word(vals[mi])}</text></g>`:'';
  return {tot, svg:`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff701e" stop-opacity=".28"/><stop offset="1" stop-color="#ff701e" stop-opacity="0"/></linearGradient></defs>${grid}
    <path class="area" d="${area}" fill="url(#ga)"/><path class="drawl" style="--len:700" d="${d}" fill="none" stroke="#ff701e" stroke-width="2.6" stroke-linecap="round"/>
    ${lab.map((l,i)=>`<text x="${xs(i)}" y="${H-4}" text-anchor="middle">${esc(l)}</text>`).join('')}${peak}</svg>`};
}

function calendar(){

  for(let d=1;d<=dim;d++){const k=y+'-'+mo+'-'+d, r=by[k]||0, isT=k===dayKey(Date.now());

let PZ={s:1,x:0,y:0,img:null};
function drawPlan(focus){
  const s=S.site, p=s&&s.P[S.plan], st=$('#stage'), pw=$('#pw'); if(!p||!st) return;
  const al=activeAlarms(); const states={};
  al.forEach(a=>{if(a.guid)states[a.guid]=a.level});
  ((S.status&&S.status.active)||[]).forEach(a=>{if(a.guid&&!states[a.guid])states[a.guid]=a.level});
  const W=p.w||1000,H=p.h||800;
  let dots='';
  s.devices.forEach(d=>d.p.forEach(q=>{ if(q[0]!==p.id) return;
    const lv=states[d.g]; const c=lv==='fire'?'fire':(lv==='attention'||lv==='alarm')?'att':lv==='malfunction'?'mal':'';
    dots+=`<i class="d ${c} ${focus&&focus.g===d.g?'sel':''}" style="left:${q[1]*W}px;top:${q[2]*H}px" data-g="${d.g}"></i>`}));
  st.style.width=W+'px'; st.style.height=H+'px';
  st.innerHTML=(p.img?`<img src="${p.img}" width="${W}" height="${H}">`:`<div style="width:${W}px;height:${H}px;background:#f1f5f9"></div>`)+dots;
  fitPlan();
  if(focus){const r=pw.getBoundingClientRect();PZ.s=PZ.s*2.2;PZ.x=r.width/2-focus.x*W*PZ.s;PZ.y=r.height/2-focus.y*H*PZ.s;applyPZ()}
  bindGestures(pw);
}
function fitPlan(){const p=S.site.P[S.plan],pw=$('#pw');if(!pw)return;const r=pw.getBoundingClientRect();const W=p.w||1000,H=p.h||800;PZ.s=Math.min(r.width/W,r.height/H);PZ.x=(r.width-W*PZ.s)/2;PZ.y=(r.height-H*PZ.s)/2;applyPZ()}
function applyPZ(){const st=$('#stage');if(st)st.style.transform=`translate(${PZ.x}px,${PZ.y}px) scale(${PZ.s})`;document.querySelectorAll('.d').forEach(d=>d.style.transform=`scale(${Math.max(.6,1/PZ.s*.9)})`)}
function zoomBy(f,cx,cy){const r=$('#pw').getBoundingClientRect();cx=cx==null?r.width/2:cx;cy=cy==null?r.height/2:cy;const ns=Math.min(8,Math.max(.15,PZ.s*f));f=ns/PZ.s;PZ.x=cx-(cx-PZ.x)*f;PZ.y=cy-(cy-PZ.y)*f;PZ.s=ns;applyPZ()}
function bindGestures(el){
  if(el._b) return; el._b=1; const pts=new Map(); let last=null;
  let down=null;
  el.addEventListener('pointerdown',e=>{if(e.target.closest('.zoombtns'))return;el.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null;down=pts.size===1?{x:e.clientX,y:e.clientY}:null});
  el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const r=el.getBoundingClientRect();const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){PZ.x+=e.clientX-prev.x;PZ.y+=e.clientY-prev.y;applyPZ()}
    else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;if(last){zoomBy(d/last.d,cx,cy);PZ.x+=cx-last.cx;PZ.y+=cy-last.cy;applyPZ()}last={d,cx,cy}}});
  const up=e=>{pts.delete(e.pointerId);last=null;
    if(down&&e.type==='pointerup'&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<8){ // tap: find nearest device dot
      let best=null,bd=30;document.querySelectorAll('#stage .d').forEach(d=>{const r=d.getBoundingClientRect();const dd=Math.hypot(r.left+r.width/2-e.clientX,r.top+r.height/2-e.clientY);if(dd<bd){bd=dd;best=d}});
      if(best)devInfo(best.dataset.g)}
    down=null};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect();zoomBy(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
}
function selPlan(id,nav){S.plan=id;if(nav)go('plans');else render(true)}
function openPlanFor(id){const e=S.events.find(x=>x.id===id)||activeAlarms().find(x=>x.id===id);const p=e&&devPos(e);if(!p)return;S.plan=p.plan.id;closeSheet();go('plans',{g:e.guid,x:p.x,y:p.y})}
function devInfo(g){const d=S.site.D[g];if(!d)return;const z=d.z.map(n=>S.site.Z[n]).filter(Boolean)[0];
  const evs=S.events.filter(e=>e.guid===g).slice(0,5);
  sheet(`<div style="display:flex;gap:12px;align-items:center"><span class="badge orange" style="width:44px;height:44px">${IC.sensor}</span><div style="min-width:0"><h3>${esc(d.t)}</h3><div class="sub">${esc(d.n)}</div></div></div>
   <div class="kv"><span>Этаж</span><b>${esc((z&&z.floor)||S.site.P[S.plan].name)}</b><span>Помещение</span><b>${esc(z?z.place:'—')}</b><span>Зона FireSec</span><b>${z?z.no+' · '+esc(z.name):'—'}</b></div>
   ${evs.length?'<div class="sect"><span class="st">События датчика</span></div><div class="list">'+evs.map(evRow).join('')+'</div>':''}`)}
function openEvent(id){const e=S.events.find(x=>x.id===id)||activeAlarms().find(x=>x.id===id);if(!e)return;const L=e.cleared?{ic:'✅',name:'Снято'}:(LV[e.level]||LV.info);const pos=devPos(e);
  sheet(`<div style="display:flex;gap:12px;align-items:center"><div style="font-size:30px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none">${L.ic}</div><div style="min-width:0"><h3>${esc(e.test?e.title:(e.cleared?'Снято: ':'')+(e.state||L.name))}</h3><div class="sub">${new Date(e.ts).toLocaleString('ru-RU')}</div></div></div>
   <div class="kv"><span>Этаж</span><b>${esc(e.floor||(pos&&pos.plan.name)||'—')}</b><span>Помещение</span><b>${esc(e.place||'—')}</b><span>Датчик</span><b>${esc(e.device||'—')}</b><span>Адрес</span><b>${esc(e.deviceName||'—')}</b><span>Зона</span><b>${e.zoneNo?e.zoneNo+' · '+esc(e.zone||''):'—'}</b>${e.test?'<span>Текст</span><b>'+esc(e.body)+'</b>':''}</div>
   ${pos&&pos.plan?`<button class="btn or" onclick="openPlanFor('${esc(e.id)}')">🗺 Показать на плане · ${esc(pos.plan.name)}</button>`:''}`)}
function sheet(h){$('#sheetc').innerHTML=h;$('#sheet').scrollTop=0;$('#sheet').classList.add('on');$('#scrim').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').onclick=closeSheet;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2500)}

/* ---------- mini plan on alarm screen ---------- */
function drawMini(){const m=$('#mini');if(!m)return;const e=activeAlarms().find(x=>x.id===m.dataset.ev)||activeAlarms()[0];const p=devPos(e);if(!p)return;const img=m.querySelector('img');const pin=m.querySelector('.pin');
  const place=()=>{const r=m.getBoundingClientRect();const W=p.plan.w,H=p.plan.h;const s=Math.max(r.width/W*1.25,r.height/H);img.style.width=W*s+'px';img.style.height=H*s+'px';let x=r.width/2-p.x*W*s,y=r.height/2-p.y*H*s;x=Math.min(0,Math.max(r.width-W*s,x));y=Math.min(0,Math.max(r.height-H*s,y));img.style.left=x+'px';img.style.top=y+'px';pin.style.left=(x+p.x*W*s)+'px';pin.style.top=(y+p.y*H*s)+'px'};
  img.complete?place():img.onload=place; m.onclick=()=>openPlanFor(e.id)}

/* ---------- routing / render ---------- */
let pendingFocus=null;
function go(v,focus){if(v!=='events')S.day=null;S.view=v;pendingFocus=focus||null;if(v==='events'){S.seen=Date.now();ls.set('seen',S.seen)}render(true);$('#main').scrollTop=0}
function render(anim){
  if(!S.site){return}
  $('#nav').classList.remove('hidden');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  const nb=newCount(); const bd=$('#evbd'); bd.textContent=nb; bd.classList.toggle('hidden',!nb||S.view==='events');
  const sc=$('#main').scrollTop;
  if(S.view==='plans'&&$('#stage')&&!pendingFocus&&render._v==='plans'&&!anim){ // keep zoom while refreshing
    const x=PZ.x,y=PZ.y,s=PZ.s; $('#main').innerHTML='<div class="view">'+V.plans()+'</div>'; $('#pw')._b=0; drawPlan(); PZ.x=x;PZ.y=y;PZ.s=s;applyPZ(); render._v='plans'; return }
  const fresh=anim||render._v!==S.view;
  $('#main').innerHTML='<div class="'+(fresh?'view anim':'')+'">'+V[S.view]()+'</div>';
  if(!fresh) $('#main').scrollTop=sc;
  render._v=S.view;
  if(S.view==='plans'){ drawPlan(pendingFocus); pendingFocus=null; const c=document.querySelector('#pchips .chip.on'); c&&c.scrollIntoView({inline:'center',block:'nearest'}) }
  if(S.view==='home') drawMini();
}

/* ---------- dock: tap + magnification while dragging a finger across ---------- */
(function dock(){
  const nav=$('#nav'), btns=[...nav.querySelectorAll('button')];
  let hov=null, dragging=false, moved=false;
  const scale=(i)=>{if(hov===null)return 1;const d=Math.abs(hov-i);return d===0?1.38:d===1?1.16:d===2?1.05:1};
  const paint=()=>btns.forEach((b,i)=>{b.style.transform=`scale(${scale(i)}) translateY(${hov===null?0:-(scale(i)-1)*14}px)`;b.classList.toggle('hv',hov===i)});
  const idxAt=x=>{let best=null,bd=1e9;btns.forEach((b,i)=>{const r=b.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-x);if(d<bd){bd=d;best=i}});return best};
  nav.addEventListener('pointerdown',e=>{dragging=true;moved=false;hov=idxAt(e.clientX);paint();try{nav.setPointerCapture(e.pointerId)}catch(x){}});
  nav.addEventListener('pointermove',e=>{if(!dragging&&e.pointerType!=='mouse')return;const i=idxAt(e.clientX);if(i!==hov){hov=i;moved=true;paint()}});
  const end=e=>{if(dragging&&hov!=null&&e.type==='pointerup'){const v=btns[hov].dataset.v;go(v)}dragging=false;hov=null;paint()};
  nav.addEventListener('pointerup',end);nav.addEventListener('pointercancel',end);
  nav.addEventListener('pointerleave',e=>{if(!dragging){hov=null;paint()}});
})();

/* ---------- onboarding ---------- */
const isStandalone = ()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function obInstall(){
  $('#nav').classList.add('hidden');
  $('#main').innerHTML=`<div class="ob view anim"><img class="logo rv" src="icons/icon-192.png" alt=""><h2 class="rv">Fire Monitor</h2>
   <p class="rv">Чтобы уведомления о пожаре приходили на iPhone, установите приложение на экран «Домой».</p>
   <div class="steps"><div class="wcard step rv"><b class="n">1</b><div>Нажмите кнопку <span class="hl">«Поделиться»</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff701e" stroke-width="2" style="vertical-align:-3px"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg> внизу Safari</div></div>
   <div class="wcard step rv"><b class="n">2</b><div>Выберите <span class="hl">«На экран „Домой“»</span> и нажмите «Добавить»</div></div>
   <div class="wcard step rv"><b class="n">3</b><div>Откройте <span class="hl">Fire Monitor</span> с экрана «Домой» и введите код с компьютера ресепшена</div></div></div>
   <p class="rv" style="font-size:12.5px">Нужен iOS 16.4 или новее. Открывайте ссылку именно в Safari.</p>
   <button class="btn gh rv" onclick="obCode(true)">Продолжить без установки</button></div>`;
}
function obCode(force){
  $('#nav').classList.add('hidden');
  $('#main').innerHTML=`<div class="ob view anim"><img class="logo rv" src="icons/icon-192.png" alt=""><h2 class="rv">Код объекта</h2>
   <p class="rv">Код показан на компьютере ресепшена в программе агента (страница «Fire Monitor — агент»).</p>
   <input class="codein rv" id="code" maxlength="14" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
   <div class="err" id="err"></div><button class="btn or rv" id="go">Подключить</button></div>`;
  const inp=$('#code'); inp.oninput=()=>{inp.value=fmtCode(inp.value)}; inp.focus();
  $('#go').onclick=async()=>{ $('#err').textContent=''; $('#go').textContent='Проверяю…';
    try{ const site=await decryptSite(inp.value); S.code=normCode(inp.value); ls.set('code',S.code); kvSet('code',S.code); S.site=indexSite(site); obPush() }
    catch(e){ $('#go').textContent='Подключить'; $('#err').textContent='Неверный код. Проверьте и попробуйте ещё раз.' } };
}
function obPush(){
  $('#nav').classList.add('hidden');
  const can='PushManager' in window&&'serviceWorker' in navigator;
  $('#main').innerHTML=`<div class="ob view anim"><div class="ring rv" style="margin:0 auto 20px;width:150px;height:150px"><div class="core" style="color:#ff701e">${IC.bell}</div></div>
   <h2 class="rv">Включите уведомления</h2><p class="rv">iPhone покажет запрос — нажмите «Разрешить». Без этого тревоги не будут приходить.</p>
   ${can?'':'<p class="err">На этом устройстве Web Push недоступен. Откройте приложение с экрана «Домой» на iPhone с iOS 16.4+.</p>'}
   <button class="btn or rv" onclick="enablePush(true)">Разрешить уведомления</button>
   <button class="btn gh rv" style="margin-top:10px" onclick="finishOb()">Позже</button></div>`;
}
function finishOb(){S.view='home';relayPoll();render(true)}
async function enablePush(fromOb){
  if(DEMO){toast('В демо-режиме уведомления не подключаются');fromOb&&finishOb();return}
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)) throw new Error('Откройте приложение с экрана «Домой» (iOS 16.4+)');
    const perm=await Notification.requestPermission();
    if(perm!=='granted') throw new Error('Уведомления не разрешены. Включите: Настройки iPhone → Уведомления → Fire Monitor');
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(CFG.vapid)});
    await relaySend({type:'sub',sub:sub.toJSON(),name:deviceName(),app:location.origin+location.pathname.replace(/[^/]*$/,'')});
    ls.set('subEndpoint',sub.endpoint);
    toast('Готово! Через минуту придёт уведомление «Телефон подключён ✓»');
    fromOb?finishOb():render();
  }catch(e){toast(e.message||String(e));if(fromOb)setTimeout(finishOb,2500)}
}
async function testPush(){
  if(DEMO){simulate();return}
  try{await relaySend({type:'test',name:deviceName()});toast('Запрос отправлен. Уведомление придёт в течение минуты')}catch(e){toast('Нет интернета или сервер связи недоступен')}
}
async function unpair(){
  if(!confirm('Отключить уведомления на этом телефоне?'))return;
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await relaySend({type:'unsub',sub:sub.toJSON()});await sub.unsubscribe()}}catch(e){}
  ls.set('code','');kvSet('code','');location.reload();
}
function savePhone(v){S.phone=v.trim();ls.set('phone',S.phone);toast('Сохранено')}
function deviceName(){const m=navigator.userAgent.match(/iPhone OS ([\d_]+)/);return (isIOS?'iPhone':'Устройство')+(m?' (iOS '+m[1].replace(/_/g,'.')+')':'')}
function urlB64(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}

/* ---------- demo ---------- */
function simulate(){
  const s=S.site; const d=s.devices.find(x=>x.t==='Дымовой датчик'&&x.z.length&&S.site.Z[x.z[0]]&&/этаж/.test(S.site.Z[x.z[0]].floor||'')&&x.p.length)||s.devices[0];
  const z=s.Z[d.z[0]]||{};
  const ev={t:'event',id:'demo-'+Date.now(),ts:Date.now(),level:'fire',state:'Пожар',stateCode:'Fire',floor:z.floor,place:z.place,zoneNo:z.no,zone:z.name,device:d.t,deviceName:d.n,guid:d.g,source:'device'};
  S.events.unshift(ev); S.view='home'; render(true); toast('Демо: срабатывание датчика');
}
function demoClear(){const a=activeAlarms();a.forEach(e=>S.events.unshift(Object.assign({},e,{id:e.id+'c',ts:Date.now(),cleared:true})));render(true);toast('Демо: тревога снята')}
function demoData(){
  const now=Date.now(), s=S.site, pick=(i)=>s.devices.filter(d=>d.z.length&&d.p.length)[i];
  const mk=(i,lv,state,dt,extra)=>{const d=pick(i),z=s.Z[d.z[0]]||{};return Object.assign({t:'event',id:'d'+i+lv+dt,ts:now-dt*60e3,level:lv,state,floor:z.floor,place:z.place,zoneNo:z.no,zone:z.name,device:d.t,deviceName:d.n,guid:d.g,source:'device'},extra||{})};
  S.events=[mk(40,'fire','Пожар',62,{cleared:true}),mk(40,'fire','Пожар',75),mk(120,'malfunction','Запылённость',300),mk(7,'info','Устройство отключено',1440),
    mk(60,'attention','Внимание',1440*2+200,{cleared:true}),mk(60,'attention','Внимание',1440*2+210),mk(15,'malfunction','Запылённость',1440*3+30),mk(90,'info','Устройство включено',1440*3+90),
    mk(150,'malfunction','Обрыв линии',1440*4+60),mk(150,'malfunction','Обрыв линии',1440*4+80,{cleared:true}),mk(33,'info','Устройство отключено',1440*5+15),mk(200,'info','Устройство включено',1440*6+300),
    {t:'event',id:'dt',ts:now-1500e3,level:'info',test:true,state:'Проверка',title:'Телефон подключён ✓',body:'Уведомления о пожаре будут приходить на iPhone',source:'agent'}].sort((a,b)=>b.ts-a.ts);
  S.status={t:'status',ts:now-120e3,firesec:true,statesOk:true,devices:407,subs:1,disabled:5,active:[],hbMin:15};
}

/* ---------- boot ---------- */
async function boot(){
  S.phone=ls.get('phone')||CFG.phone||''; S.seen=+ls.get('seen')||0; S.range=ls.get('range')||'week';
  S.theme=ls.get('theme')||'day'; document.body.classList.toggle('night',S.theme==='night');
  if('serviceWorker' in navigator && !DEMO){navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('message',async m=>{if(m.data&&m.data.type==='event'){await loadEvents();render()}});}
  if(DEMO){ S.code='DEMO'; S.site=indexSite(window.FM_SITE_PLAIN||await (await fetch('site.json')).json()); demoData(); render(true); document.body.insertAdjacentHTML('beforeend','<div class="demo-badge">ДЕМО</div>');
    setTimeout(()=>{ if(S.view==='home') toast('Настройки → «Проверить уведомление» покажет тревогу') },1500); return }
  const code=ls.get('code')||await kvGet('code');
  if(!code){ if(isIOS&&!isStandalone()) obInstall(); else obCode(); return }
  try{ S.code=code; S.site=indexSite(await decryptSite(code)); }catch(e){ obCode(); return }
  const st=await kvGet('status'); if(st) S.status=st;
  await loadEvents(); render(true); relayPoll();
  if(('Notification' in window)&&Notification.permission==='default'&&isStandalone()) setTimeout(()=>toast('Включите уведомления в «Настройках»'),1200);
}
setInterval(()=>{ if(document.visibilityState==='visible'&&S.site&&!DEMO) relayPoll() },15000);
setInterval(()=>{ if(S.site&&S.view==='home'&&!$('#sheet').classList.contains('on')) render() },30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.site){relayPoll()}});
boot();
